<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JobStash — save job links, apply later</title>
    <meta name="description" content="A digital clipboard for job hunting: save a job posting link on your phone, then open the same list on your laptop and apply." />
    <meta name="theme-color" content="#0F2D5B" />
    <!-- The logo as the tab icon (SVG where supported, .ico for the rest), the
         iPhone home-screen icon, and the manifest for Android. All in public/. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The preview card when the link is shared in Messenger, Facebook, chats
         and so on. The image address must be the full live address, so if the
         site moves to a new address, change it here (and in og:url). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JobStash" />
    <meta property="og:title" content="JobStash — save job links, apply later" />
    <meta property="og:description" content="Found a job on your phone? Stash the link in seconds, then open the same list on your laptop and apply." />
    <meta property="og:url" content="https://jobstash-ph.vercel.app/" />
    <meta property="og:image" content="https://jobstash-ph.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The JobStash logo, with the words: Found it on your phone? Stash it. Apply later." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
